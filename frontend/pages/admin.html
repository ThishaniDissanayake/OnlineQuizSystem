<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Quiz Server</title>
    <link rel="stylesheet" href="../styles/admin.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 Quiz Server - Admin Dashboard</h1>
            <div class="server-status">
                <span id="status-indicator" class="status-dot offline"></span>
                <span id="status-text">Server Offline</span>
            </div>
        </header>

        <main>
            <section class="control-panel">
                <div class="card">
                    <h2>📊 Server Control</h2>
                    <div class="server-info">
                        <p><strong>Port:</strong> <span id="server-port">5000</span></p>
                        <p><strong>Connected Students:</strong> <span id="student-count">0</span></p>
                    </div>
                    <div class="button-group">
                        <button id="start-quiz-btn" class="btn btn-primary" disabled>
                            🚀 Start Quiz
                        </button>
                        <button id="refresh-btn" class="btn btn-secondary">
                            🔄 Refresh List
                        </button>
                    </div>
                </div>
            </section>

            <section class="students-section">
                <div class="card">
                    <h2>👥 Connected Students</h2>
                    <div id="students-list" class="students-list">
                        <div class="empty-state">
                            <p>📭 No students connected yet</p>
                            <p class="hint">Students will appear here when they connect to the server</p>
                        </div>
                    </div>
                </div>
            </section>

            <section class="logs-section">
                <div class="card">
                    <h2>📝 Activity Log</h2>
                    <div id="activity-log" class="activity-log">
                        <div class="log-entry">
                            <span class="timestamp">[System]</span>
                            <span>Waiting for server connection...</span>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="../js/admin/app.js"></script>
</body>
</html>
