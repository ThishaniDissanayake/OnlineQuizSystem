<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz System</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 Online Quiz System</h1>
            <p class="subtitle">Real-time Quiz Platform</p>
        </header>
        
        <main class="landing-page">
            <div class="role-selection">
                <h2>Choose Your Role</h2>
                <div class="role-cards">
                    <a href="pages/admin.html" class="role-card admin-card">
                        <div class="card-icon">👨‍💼</div>
                        <h3>Admin</h3>
                        <p>Manage questions and quiz sessions</p>
                    </a>
                    <a href="pages/student.html" class="role-card student-card">
                        <div class="card-icon">👨‍🎓</div>
                        <h3>Student</h3>
                        <p>Connect and participate in quiz</p>
                    </a>
                </div>
            </div>

            <div class="features">
                <h3>Features</h3>
                <div class="feature-list">
                    
                    <div class="feature-item">
                        <span>🎯</span>
                        <p>Live Question Broadcasting</p>
                    </div>
                    <div class="feature-item">
                        <span>👥</span>
                        <p>Multi-Student Support</p>
                    </div>
                    <div class="feature-item">
                        <span>📊</span>
                        <p>Real-time Results</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="js/main/app.js"></script>
</body>
</html>
